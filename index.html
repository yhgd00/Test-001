<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>迷宫勇者 · Web Roguelike</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <h1>迷宫勇者</h1>
        <p class="help">方向键 / WASD 移动，撞到敌人即攻击。拾取 <span class="item">!</span> 可回血，走到 <span class="stairs">&gt;</span> 进入下一层。</p>
        <div class="stats">
          <span>楼层：<strong id="floor">1</strong></span>
          <span>生命：<strong id="hp">0</strong></span>
          <span>攻击：<strong id="atk">0</strong></span>
          <span>敌人：<strong id="enemies">0</strong></span>
        </div>
        <button id="restart">重新开始</button>
        <p id="message" class="message"></p>
      </section>
      <section class="game-wrap">
        <canvas id="game" width="672" height="448" aria-label="rougelike game canvas"></canvas>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
